
<!DOCTYPE html>

{% load static %}
<html>
    <head>
        <!-- Title is the name of the tab -->
        <title> Chris' Blog</title>
        
        <!-- <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lobster&subset=latin,latin-ext">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

        {% load bootstrap5 %}
        {% bootstrap_css %} 
        <!-- here just manually add the bootstrap stuff  -->
        <link rel="stylesheet" href="{% static 'css/blog.css' %}">
        <!-- Load in bootstrap CSS framework; custom `blog.css` overrides come after -->
    </head>

    <body>    
        <header class="page-header">
            <div class="container"> 
                <!-- Container auto centers -->
                <h1><a href="{% url 'post_list' %}"> My Django Girls Blog Project</a></h1>     
            </div>    
        </header>
   
        <main class="container">
            <div class="row">
                <div class="col">
                   {% block content %}
                   {% endblock %}
                </div>
            </div>
        </main>
      
        <footer class="page-footer"> 
            <div class="container">
                <div class="row">
                    <div class="col">
                        {% include 'blog/footer.html' %}
                        
                    </div>
                </div>
            </div>
        </footer>
        {% bootstrap_javascript %}
    </body>
</html>
